[project]
name = "personal-blog-api"
version = "0.1.0"
description = "FastAPI backend for the personal blog"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.17,<2",
    "argon2-cffi>=25,<27",
    "fastapi>=0.121,<1",
    "markdown-it-py>=4,<5",
    "nh3>=0.3,<1",
    "pillow>=12,<14",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pygments>=2.19,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.38,<1",
    "vercel-blob>=0.5,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.uv]
package = false
